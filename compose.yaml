name: money-graph

x-app: &app
  image: money-graph:local
  init: true

services:
  api:
    <<: *app
    profiles: ["backend"]
    build:
      context: .
      target: runtime
    command: ["python", "-m", "uvicorn", "backend.api:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    environment: &backend-env
      MONEY_GRAPH_STATE: /state
      MONEY_GRAPH_DATA: /data
      MONEY_GRAPH_OUTPUTS: /seed-results
    volumes: &backend-volumes
      - ./data:/data:ro
      - ./outputs:/seed-results:ro
      - backend-state:/state
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=5).read()"]
      interval: 5s
      timeout: 6s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  worker:
    <<: *app
    profiles: ["backend"]
    command: ["python", "-m", "backend.worker"]
    environment: *backend-env
    volumes: *backend-volumes
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  pipeline:
    <<: *app
    profiles: ["tools"]
    command: ["python", "-m", "backend.pipeline", "--data", "/data", "--out", "/results"]
    volumes:
      - ./data:/data:ro
      - results:/results
    restart: "no"

  prepare:
    <<: *app
    command: ["python", "scripts/ensure_results.py"]
    volumes:
      - ./data:/data:ro
      - results:/results
    restart: "no"

  ui:
    <<: *app
    build:
      context: .
      target: runtime
    depends_on:
      prepare:
        condition: service_completed_successfully
    volumes:
      - results:/results:ro
    ports:
      - "127.0.0.1:3000:8501"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=5).read()"]
      interval: 10s
      timeout: 6s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  validate:
    <<: *app
    profiles: ["tools"]
    command: ["python", "-m", "backend.validate", "--data", "/data", "--out", "/results"]
    volumes:
      - ./data:/data:ro
      - results:/results:ro

  tests:
    image: money-graph-tests:local
    build:
      context: .
      target: tests
    init: true
    profiles: ["tools"]
    command: ["python", "-m", "pytest", "-q"]
    volumes:
      - ./data:/app/data:ro
      - ./outputs:/app/outputs:ro

volumes:
  results:
  backend-state:
